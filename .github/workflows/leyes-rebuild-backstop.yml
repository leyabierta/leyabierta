name: Leyes rebuild backstop

# Safety net for the leyes → web pipeline.
#
# Primary path: scripts/daily-pipeline.sh on KonarServer fires a
# `pipeline-finished` repository_dispatch (Step 9.6) once ingest,
# ingest-analisis, the AI enrichment steps and the WAL checkpoint have all
# finished — i.e. once the DB the API serves, and the `leyes` repo pushed
# earlier in Step 1.5, both hold the day's content. That triggers deploy.yml.
#
# This workflow is the backstop in case that dispatch is dropped (the pipeline
# died before Step 9.6, LEYABIERTA_DISPATCH_TOKEN missing on the server, GitHub
# Actions degradation, etc.). Every 30 minutes it:
#   1. Reads the current HEAD SHA (and commit date) of `leyabierta/leyes` main.
#   2. Compares the SHA to the last-built SHA stored in actions/cache.
#   3. If different AND the commit is older than GRACE_MINUTES → fires
#      `repository_dispatch` (type `pipeline-finished`, same code path as the
#      primary trigger) and refreshes the cache with the new SHA.
#
# Why the grace period: `leyes` is pushed by Step 1.5 of daily-pipeline.sh
# well before ingest/AI finish (~20-30 min later) and before Step 9.6 fires
# the real signal. Without a grace period, this workflow's very next 30-min
# tick after that push would see "drift" and fire a premature deploy itself —
# exactly the bug this whole change exists to fix, just moved into the
# backstop. Skipping drift younger than GRACE_MINUTES gives the normal daily
# run room to finish and dispatch on its own; the marker is deliberately left
# untouched while skipped so the check repeats on the next tick. Once a drift
# is older than GRACE_MINUTES (pipeline crashed, hung, or never ran), this
# workflow dispatches anyway so the site is never stuck more than one grace
# period plus one 30-min tick behind a `leyes` push.
#
# The marker is ALSO written by deploy.yml's deploy-web job ("Sync backstop
# cache marker") on every successful web deploy, whatever triggered it.
# Otherwise a primary-path deploy never advances the marker and this workflow
# re-dispatches a rebuild that already happened.
#
# Cache-based storage chosen because the default GITHUB_TOKEN cannot mutate
# repo variables. Cache entries idle-evict after 7 days; we run every 30 min
# so the entry stays warm indefinitely.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read   # GITHUB_TOKEN only used to read leyes (public repo)
                   # Dispatch uses LEYABIERTA_DISPATCH_TOKEN (PAT), not GITHUB_TOKEN
  actions: read    # list in-flight deploy.yml runs (see "Check for in-flight deploy")

concurrency:
  group: leyes-backstop
  cancel-in-progress: false

jobs:
  check-and-trigger:
    name: Check leyes SHA and trigger rebuild if drifted
    runs-on: ubuntu-latest
    steps:
      - name: Fetch remote leyes HEAD
        id: remote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          INFO=$(gh api repos/leyabierta/leyes/commits/main --jq '{sha: .sha, date: .commit.committer.date}')
          SHA=$(echo "$INFO" | jq -r '.sha')
          COMMIT_DATE=$(echo "$INFO" | jq -r '.date')
          AGE_MINUTES=$(( ( $(date -u +%s) - $(date -u -d "$COMMIT_DATE" +%s) ) / 60 ))
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "age_minutes=$AGE_MINUTES" >> "$GITHUB_OUTPUT"
          echo "Remote leyes HEAD: $SHA (commit date $COMMIT_DATE, age ${AGE_MINUTES}m)"

      - name: Restore last built SHA
        id: cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .last-leyes-sha
          key: last-leyes-sha-${{ steps.remote.outputs.sha }}
          restore-keys: |
            last-leyes-sha-

      # Writing the marker at the END of deploy-web (correct: only a finished
      # build may claim a SHA) leaves a ~6 min window in which the marker is
      # legitimately stale. This job runs every 30 min, so roughly one leyes
      # push in five lands inside that window: we would see "drift", dispatch,
      # and `concurrency: cancel-in-progress` on deploy-main would kill the
      # healthy in-flight build to start the same one again. If a deploy is
      # already running, stand down and re-check on the next tick — the marker
      # is deliberately left untouched, so nothing is marked built prematurely.
      #
      # Bounded to runs younger than 30 min so a wedged run cannot blind the
      # backstop indefinitely. Any failure here (missing scope, API blip)
      # falls back to 0 == "not busy", i.e. exactly today's behaviour.
      - name: Check for in-flight deploy
        id: inflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          RUNS=$(gh run list --repo "${{ github.repository }}" \
            --workflow deploy.yml --status in_progress --limit 30 \
            --json createdAt \
            --jq '[.[] | select((now - (.createdAt | fromdateiso8601)) < 1800)] | length' \
            2>/dev/null) || RUNS=""
          case "$RUNS" in
            ''|*[!0-9]*) RUNS=0 ;;
          esac
          echo "In-flight deploy runs: $RUNS"
          if [ "$RUNS" -gt 0 ]; then
            echo "busy=true" >> "$GITHUB_OUTPUT"
          else
            echo "busy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare and dispatch if drifted
        id: decide
        env:
          # IMPORTANT: dispatch must use a PAT, NOT GITHUB_TOKEN. GitHub
          # explicitly suppresses workflow-triggering events fired by the
          # default GITHUB_TOKEN to prevent accidental loops — the dispatch
          # API call returns 204 (success) but deploy.yml never runs. This is
          # the same PAT scripts/daily-pipeline.sh uses on KonarServer for its
          # own pipeline-finished dispatch (as LEYABIERTA_DISPATCH_TOKEN in
          # .env.prod there) — one token, two places it's configured.
          GH_TOKEN: ${{ secrets.LEYABIERTA_DISPATCH_TOKEN }}
          REMOTE_SHA: ${{ steps.remote.outputs.sha }}
          AGE_MINUTES: ${{ steps.remote.outputs.age_minutes }}
          DEPLOY_BUSY: ${{ steps.inflight.outputs.busy }}
          # How long a `leyes` push is given to be followed by the daily
          # pipeline's own pipeline-finished dispatch before this backstop
          # treats it as "the pipeline is never finishing" and deploys anyway.
          # Observed pipeline runtime (push → WAL checkpoint) is ~25-30 min;
          # this leaves generous headroom for a slow AI-step retry without
          # letting a genuinely dead run block the site indefinitely (worst
          # case: GRACE_MINUTES + one more 30-min tick).
          GRACE_MINUTES: ${{ vars.LEYES_BACKSTOP_GRACE_MINUTES || '90' }}
        run: |
          set -euo pipefail

          LAST_SHA=""
          if [ -f .last-leyes-sha ]; then
            LAST_SHA=$(cat .last-leyes-sha)
          fi
          echo "Last built SHA: ${LAST_SHA:-<none>}"

          if [ "$DEPLOY_BUSY" = "true" ]; then
            echo "⏸ a deploy is already in flight — standing down, re-checking in 30 min"
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$REMOTE_SHA" = "$LAST_SHA" ]; then
            echo "✓ in sync — no rebuild needed"
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$AGE_MINUTES" -lt "$GRACE_MINUTES" ]; then
            echo "⏳ drift detected but leyes HEAD is only ${AGE_MINUTES}m old (grace=${GRACE_MINUTES}m) — the daily pipeline is likely still running; standing down, re-checking in 30 min"
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "⚠ drift detected and leyes HEAD is ${AGE_MINUTES}m old (grace=${GRACE_MINUTES}m exceeded) — firing repository_dispatch as a fallback"
          gh api -X POST "repos/${{ github.repository }}/dispatches" \
            -f event_type=pipeline-finished \
            -f "client_payload[source]=backstop" \
            -f "client_payload[remote_sha]=$REMOTE_SHA" \
            -f "client_payload[previous_sha]=${LAST_SHA:-none}"

          echo "$REMOTE_SHA" > .last-leyes-sha
          echo "drifted=true" >> "$GITHUB_OUTPUT"
          echo "✓ dispatch sent"

      - name: Save updated SHA
        if: steps.decide.outputs.drifted == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .last-leyes-sha
          key: last-leyes-sha-${{ steps.remote.outputs.sha }}
